<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pyramid H Language</title>
<style>
body{font-family:Arial;background:#0d1117;color:#c9d1d9;text-align:center;padding:20px}
.container{max-width:600px;margin:auto;background:#161b22;padding:20px;border-radius:10px}
h1{color:#58a6ff}
button{background:#238636;color:white;border:none;padding:10px 20px;font-size:16px;border-radius:5px;cursor:pointer;margin-top:15px}
#results{margin-top:20px;text-align:left;background:#0d1117;padding:15px;border-radius:5px;font-family:monospace}
</style>
</head>
<body>
<div class="container">
<h1>Pyramid H Language</h1>
<p><strong>لغة هرم H:</strong> إطار بنائي لدراسة الأعداد الأولية بلا لانهاية فعلية.</p>
<p>أدخل قمة الهرم (n):</p>
<input type="number" id="apexInput" value="10" min="2" max="1000" style="padding:8px;font-size:16px;width:80px">
<br>
<button onclick="runSimulation()">شغل الهرم</button>
<div id="results">اضغط على الزر لعرض النتائج...</div>
<p style="font-size:12px;margin-top:15px">Fadwa (2026) - Pyramid H Language</p>
</div>
<script>
function isPrime(num){
if(num<2) return false;
if(num===2) return true;
if(num%2===0) return false;
for(let i=3;i*i<=num;i+=2){ if(num%i===0) return false; }
return true;
}
function runSimulation(){
let n=parseInt(document.getElementById('apexInput').value);
let bridges=[];
for(let d=0; d<n; d++){
let p1=n-d; let p2=n+d;
if(isPrime(p1) && isPrime(p2)){ bridges.push({d:d,p1:p1,p2:p2}); }
}
let html="<b>H_"+n+": "+bridges.length+" bridges</b><br><br>";
bridges.forEach(b=>{ html+="d="+b.d+" -> ("+b.p1+","+b.p2+")<br>"; });
if(bridges.length===0) html+="No bridges found";
document.getElementById('results').innerHTML=html;
}
</script>
</body>
</html>
